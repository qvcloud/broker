name: Pull Request Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build observability example
        run: go build ./examples/observability

      - name: Smoke test observability switches
        run: |
          go run ./examples/observability
          go run ./examples/observability -observe -health -diagnostics
          go run ./examples/observability -observe -metrics -correlation -events

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Run unit tests
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 75) { printf "coverage %.1f%% is below 75%%\n", total; exit 1 } }'
          printf 'total coverage: %s%%\n' "$total"

      - name: Enforce observability performance budget
        env:
          BROKER_ENFORCE_PERFORMANCE: "1"
        run: go test -count=1 -run '^TestObservabilityStandardOverheadBudget$' .

      - name: Run race detector
        run: go test -race -count=1 ./...
